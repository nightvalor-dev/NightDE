# hyprlock — frosted lock screen (matches the wlogout overlay)
# Location: ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred snapshot of whatever was on screen when you locked
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 10
    brightness = 0.6
    vibrancy = 0.25
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 110
    font_family = Rubik
    color = rgba(255, 255, 255, 0.95)
    position = 0, 155
    halign = center
    valign = center
}

# Date under the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = Rubik
    color = rgba(255, 255, 255, 0.75)
    position = 0, 65
    halign = center
    valign = center
}

# Round profile picture above the password box
# ~/.face must be SQUARE for a perfect circle (see crop command)
image {
    monitor =
    path = ~/.config/hypr/hyprlock/profile.png
    size = 130
    rounding = -1
    border_size = 3
    border_color = rgba(255, 255, 255, 0.35)
    position = 0, -57
    halign = center
    valign = center
}

# Frosted-glass password box
input-field {
    monitor =
    size = 320, 56
    rounding = 16
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgb(255, 255, 255)
    font_family = Rubik
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Password</span>
    check_color = rgba(126, 156, 216, 0.7)
    fail_color = rgba(232, 36, 36, 0.7)
    fail_text = <span foreground="##ffffff">Wrong password</span>
    capslock_color = rgba(230, 195, 132, 0.7)
    position = 0, -193
    halign = center
    valign = center
}