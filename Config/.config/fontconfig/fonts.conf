<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- NightDE: Rubik everywhere for UI text, JetBrainsMono Nerd Font as fallback
     (icons / missing glyphs). Monospace stays JetBrainsMono for terminals & code. -->
<fontconfig>
  <!-- Default UI font -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Rubik</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>Rubik</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <!-- Anything asking for Rubik falls back to the Nerd Font for icons -->
  <alias>
    <family>Rubik</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
    </accept>
  </alias>

  <!-- Terminals and editors keep a monospaced font -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
